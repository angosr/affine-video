[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "veda-subnet"
version = "0.1.0"
description = "Sparse selector training competition for a Bittensor subnet"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bittensor==11.3.0",
    "httpx==0.28.1",
    "huggingface-hub==2.2.0",
    "numpy==2.5.1",
    "safetensors==0.8.0",
]

[project.optional-dependencies]
r2 = ["boto3>=1.40,<2"]

[project.scripts]
veda = "cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.14,<0.15",
]
experiments = [
    "scikit-learn==1.9.1",
    "scipy==1.18.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/miner", "src/validator", "src/scoring", "src/cli.py"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

